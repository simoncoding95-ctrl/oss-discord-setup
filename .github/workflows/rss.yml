name: rss

on:
  schedule:
    - cron: "41 */2 * * *"   # every 2 hours
  workflow_dispatch:

permissions:
  contents: write            # commit rss_seen.json back

concurrency:
  group: feeds   # shared with good-first-issues.yml: both commit state files
  cancel-in-progress: false

jobs:
  rss:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Post new feed items
        run: uv run rss_feed.py
        env:
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
      - name: Save posted state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss_seen.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(rss): update seen items"
            git pull --rebase
            git push
          fi
